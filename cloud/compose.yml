services:
  pec:
    container_name: pec
    platform: linux/amd64
    restart: unless-stopped
    volumes:
      - ./esus-data/opt:/opt/e-SUS
      - ./esus-data/backups:/backups
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        - TZ=${TZ}
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASS=${POSTGRES_PASS:-pass}
      - POSTGRES_HOST=${POSTGRES_HOST:-db}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${POSTGRES_DB:-esus}
    privileged: true
    stdin_open: true
    tty: true
    ports:
      - "${APP_PORT:-8080}:8080"
      - "${HTTP_PORT:-8082}:80"
      - "${HTTPS_PORT:-8443}:443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--timeout=5", "--output-document=/dev/null", "http://127.0.0.1:8080/api/public/info"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 5m
    depends_on:
      db:
        condition: service_healthy
  db:
    container_name: db
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    command: ["postgres", "-c", "password_encryption=md5"]
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASS}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_INITDB_ARGS=--auth-host=md5
      - ESUS_LEITURA_PASS=${ESUS_LEITURA_PASS:?Defina ESUS_LEITURA_PASS em cloud/.env}
    volumes:
      - esus-db-data:/var/lib/postgresql/data
      - ./esus-data/backups:/backups:ro
      - ./db-entrypoint:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  esus-db-data:
